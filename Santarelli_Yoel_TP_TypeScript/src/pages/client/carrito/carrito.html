<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mi Carrito - Food Store</title>
  <link rel="stylesheet" href="../../../styles/global.css" />
  <link rel="stylesheet" href="./carrito.css" />
</head>
<body>
  <div class="cart-wrapper">
    
    <header class="cart-header">
      <a href="../home/home.html" class="back-link">← Volver al Catálogo</a>
      <h1>Mi Carrito</h1>
    </header>

    <div class="cart-content">
      
      <section class="cart-items-section">
        <div id="cart-items" class="cart-items-list"></div>
        
        <button id="clearCartBtn" class="btn-secondary">Vaciar Carrito</button>
      </section>
      
      <aside class="cart-summary-card">
        <h3>Resumen del Pedido</h3>
        
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotalAmount">$0</span>
        </div>
        <div class="summary-row">
          <span>Envío</span>
          <span class="free-shipping">Gratis</span>
        </div>
        <hr />
        <div class="summary-row total-row">
          <span>Total a pagar</span>
          <strong id="totalAmount">$0</strong>
        </div>

        <button id="checkoutBtn" class="btn-checkout">Finalizar Compra</button>
      </aside>
    </div>
  </div>

  <script type="module" src="./carrito.ts"></script>
</body>
</html>
